<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بوت أذكركم</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #000; color: white; margin: 0; overflow-x: hidden; }
        .glass-card { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(16, 185, 129, 0.2); }
        .active-tab { background: white !important; color: #059669 !important; transform: scale(1.05); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => { lucide.createIcons(); }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        function PrayerApp() {
            const [activeTab, setActiveTab] = useState('home');
            const [tasbihCount, setTasbihCount] = useState(0);
            const [prayerTimes, setPrayerTimes] = useState(null);
            const [loading, setLoading] = useState(true);
            
            const tg = window.Telegram?.WebApp;

            useEffect(() => {
                if (tg) {
                    tg.ready();
                    tg.expand();
                    tg.setHeaderColor('#059669');
                }
                fetchPrayerTimes();
            }, []);

            const fetchPrayerTimes = async () => {
                try {
                    // API الاذان يعطي الوقت بنظام 24 ساعة افتراضياً
                    const res = await fetch('https://api.aladhan.com/v1/timingsByCity?city=Riyadh&country=Saudi Arabia&method=4');
                    const data = await res.json();
                    if (data.code === 200) {
                        setPrayerTimes(data.data.timings);
                    }
                    setLoading(false);
                } catch (e) {
                    setLoading(false);
                }
            };

            const handleTasbih = () => {
                setTasbihCount(prev => prev + 1);
                if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            };

            const prayerLabels = {
                Fajr: 'الفجر', Sunrise: 'الشروق', Dhuhr: 'الظهر',
                Asr: 'العصر', Maghrib: 'المغرب', Isha: 'العشاء'
            };

            return (
                <div className="flex flex-col min-h-screen max-w-md mx-auto pb-10">
                    
                    {/* Header */}
                    <div className="bg-gradient-to-r from-emerald-600 to-teal-700 p-6 sticky top-0 z-50 shadow-2xl rounded-b-[2rem]">
                        <h1 className="text-2xl font-black text-center mb-6 tracking-wider">بوت أذكركم</h1>
                        <div className="flex bg-emerald-900/40 p-1 rounded-2xl gap-1">
                            {['home', 'tasbih', 'about'].map((tab) => (
                                <button 
                                    key={tab}
                                    onClick={() => setActiveTab(tab)}
                                    className={`flex-1 py-3 rounded-xl text-sm font-bold transition-all duration-300 flex justify-center items-center gap-2 ${activeTab === tab ? 'active-tab shadow-lg' : 'text-emerald-100'}`}
                                >
                                    <Icon name={tab === 'home' ? 'home' : tab === 'tasbih' ? 'fingerprint' : 'info'} size={16} />
                                    {tab === 'home' ? 'الرئيسية' : tab === 'tasbih' ? 'تسبيح' : 'نبذة'}
                                </button>
                            ))}
                        </div>
                    </div>

                    <main className="p-5 flex-1">
                        {activeTab === 'home' && (
                            <div className="space-y-6 animate-in fade-in duration-500">
                                <div className="text-center text-emerald-400 bg-emerald-500/10 py-3 rounded-2xl border border-emerald-500/20 font-bold">
                                    نظام الوقت: 24 ساعة
                                </div>

                                {loading ? (
                                    <div className="text-center py-20">جاري التحميل...</div>
                                ) : (
                                    <div className="grid grid-cols-2 gap-4">
                                        {Object.entries(prayerLabels).map(([key, label]) => (
                                            <div key={key} className="glass-card p-5 rounded-3xl text-center shadow-xl">
                                                <div className="text-emerald-500 text-sm font-bold mb-1">{label}</div>
                                                <div className="text-2xl font-black">{prayerTimes?.[key]}</div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'tasbih' && (
                            <div className="flex flex-col items-center justify-center py-8 space-y-10 animate-in zoom-in duration-300">
                                <div onClick={handleTasbih} className="w-72 h-72 rounded-full border-[6px] border-emerald-500/20 flex items-center justify-center bg-emerald-500/10 shadow-[0_0_60px_rgba(16,185,129,0.15)] active:scale-90 transition-all cursor-pointer">
                                    <div className="text-center">
                                        <div className="text-8xl font-black">{tasbihCount}</div>
                                        <div className="text-emerald-400 font-black mt-2">سبّح</div>
                                    </div>
                                </div>
                                <button onClick={() => setTasbihCount(0)} className="text-gray-500 text-sm underline">إعادة تعيين العداد</button>
                            </div>
                        )}

                        {activeTab === 'about' && (
                            <div className="text-center space-y-6 py-6 animate-in fade-in duration-500">
                                <div className="glass-card p-8 rounded-[2.5rem]">
                                    <div className="w-20 h-20 bg-emerald-600 rounded-full mx-auto mb-6 flex items-center justify-center">
                                        <Icon name="user" size={32} className="text-white" />
                                    </div>
                                    <h2 className="text-2xl font-black mb-2">بوت أذكركم</h2>
                                    <div className="h-px bg-emerald-500/20 w-full my-6"></div>
                                    <p className="text-xl text-emerald-100 leading-relaxed font-bold italic">
                                        قال تعالى : ﴿فَاذْكُرُونِي أَذْكُرْكُمْ وَاشْكُرُوا لِي وَلَا تَكْفُرُونِ﴾
                                    </p>
                                    <div className="mt-10 pt-6 border-t border-emerald-500/10">
                                        <p className="text-xs text-gray-500 font-bold tracking-widest uppercase">تطوير</p>
                                        <p className="text-lg font-black text-emerald-500">lcczzl</p>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PrayerApp />);
    </script>
</body>
</html>
