<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بوت أذكركم</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #000; color: white; margin: 0; overflow: hidden; }
        .glass-card { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(16, 185, 129, 0.2); }
        .active-tab { background: white !important; color: #059669 !important; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Icon = ({ name, size = 20 }) => {
            useEffect(() => { lucide.createIcons(); }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }}></i>;
        };

        function PrayerApp() {
            const [activeTab, setActiveTab] = useState('home');
            const [tasbihCount, setTasbihCount] = useState(0);
            const [prayerTimes, setPrayerTimes] = useState(null);
            const [loading, setLoading] = useState(true);
            const tg = window.Telegram?.WebApp;

            useEffect(() => {
                if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor('#059669'); }
                fetchPrayerTimes();
            }, []);

            // دالة تحويل الوقت من 24 إلى 12 ساعة مع إضافة ص/م
            const formatTime = (time) => {
                if (!time) return "--:--";
                let [hours, minutes] = time.split(':');
                hours = parseInt(hours);
                const period = hours >= 12 ? 'م' : 'ص';
                hours = hours % 12 || 12;
                return `${hours}:${minutes} ${period}`;
            };

            const fetchPrayerTimes = async () => {
                try {
                    const res = await fetch('https://api.aladhan.com/v1/timingsByCity?city=Riyadh&country=Saudi Arabia&method=4');
                    const data = await res.json();
                    if (data.code === 200) setPrayerTimes(data.data.timings);
                    setLoading(false);
                } catch (e) { setLoading(false); }
            };

            const handleTasbih = () => {
                setTasbihCount(c => c + 1);
                if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            };

            const prayerLabels = { Fajr: 'الفجر', Sunrise: 'الشروق', Dhuhr: 'الظهر', Asr: 'العصر', Maghrib: 'المغرب', Isha: 'العشاء' };

            return (
                <div className="flex flex-col min-h-screen max-w-md mx-auto">
                    <div className="bg-gradient-to-r from-emerald-600 to-teal-700 p-6 sticky top-0 z-50 rounded-b-[2rem] shadow-xl">
                        <h1 className="text-2xl font-black text-center mb-6">بوت أذكركم</h1>
                        <div className="flex bg-emerald-900/40 p-1 rounded-2xl gap-1">
                            {['home', 'tasbih', 'about'].map((tab) => (
                                <button key={tab} onClick={() => setActiveTab(tab)} className={`flex-1 py-3 rounded-xl text-sm font-bold flex justify-center items-center gap-2 ${activeTab === tab ? 'active-tab shadow-lg' : 'text-emerald-100'}`}>
                                    <Icon name={tab === 'home' ? 'home' : tab === 'tasbih' ? 'fingerprint' : 'info'} size={16} />
                                    {tab === 'home' ? 'الرئيسية' : tab === 'tasbih' ? 'تسبيح' : 'نبذة'}
                                </button>
                            ))}
                        </div>
                    </div>

                    <main className="p-5 flex-1 overflow-y-auto">
                        {activeTab === 'home' && (
                            <div className="grid grid-cols-2 gap-4 animate-in fade-in duration-500">
                                {loading ? <div className="col-span-2 text-center py-10 font-bold">جاري التحميل...</div> :
                                    Object.entries(prayerLabels).map(([key, label]) => (
                                        <div key={key} className="glass-card p-5 rounded-3xl text-center">
                                            <div className="text-emerald-500 text-sm font-bold mb-1">{label}</div>
                                            <div className="text-xl font-black tracking-tighter">{formatTime(prayerTimes?.[key])}</div>
                                        </div>
                                    ))
                                }
                            </div>
                        )}

                        {activeTab === 'tasbih' && (
                            <div className="flex flex-col items-center py-10 space-y-8 animate-in zoom-in duration-300">
                                <div onClick={handleTasbih} className="w-64 h-64 rounded-full border-[6px] border-emerald-500/20 flex items-center justify-center bg-emerald-500/10 shadow-[0_0_50px_rgba(16,185,129,0.1)] active:scale-95 transition-all">
                                    <div className="text-center">
                                        <div className="text-7xl font-black">{tasbihCount}</div>
                                        <div className="text-emerald-400 font-bold mt-2">سبّح</div>
                                    </div>
                                </div>
                                <button onClick={() => setTasbihCount(0)} className="text-gray-500 text-sm underline">تصفير العداد</button>
                            </div>
                        )}

                        {activeTab === 'about' && (
                            <div className="text-center space-y-6 animate-in fade-in duration-500">
                                <div className="glass-card p-8 rounded-[2.5rem]">
                                    <div className="w-16 h-16 bg-emerald-600 rounded-full mx-auto mb-4 flex items-center justify-center">
                                        <Icon name="user" size={30} />
                                    </div>
                                    <h2 className="text-2xl font-black mb-2">بوت أذكركم</h2>
                                    <div className="h-px bg-emerald-500/20 w-full my-6"></div>
                                    <p className="text-lg text-emerald-100 font-bold italic">
                                        قال تعالى : ﴿فَاذْكُرُونِي أَذْكُرْكُمْ وَاشْكُرُوا لِي وَلَا تَكْفُرُونِ﴾
                                    </p>
                                    <div className="mt-8 pt-6 border-t border-emerald-500/10 text-xs text-gray-500">تطوير: lcczzl</div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PrayerApp />);
    </script>
</body>
</html>
